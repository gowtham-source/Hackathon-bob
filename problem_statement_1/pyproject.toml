[project]
name = "docsync-mcp"
version = "0.1.0"
description = "DocSync MCP Server — keep coding agents grounded on the latest SDK docs"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "openai>=2.37.0",
    "google-genai>=2.3.0",
    "anthropic>=0.102.0",
]

[project.scripts]
docsync = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["docsync*"]
