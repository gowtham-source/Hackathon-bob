[project]
name = "code2paper"
version = "0.1.0"
description = "Code2Paper — Bob mode + skills that turn a codebase into a publication-ready research paper (Typst)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "google-genai>=2.3.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
include = ["literature*"]
